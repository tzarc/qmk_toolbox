name: CI

on:
  push:
    branches: [master, avalonia-net10-port]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build, test and package
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Build and test run through the same Docker-based scripts as local development;
    # the test container reuses the build container's outputs (same mounted paths).
    - name: Build
      run: ./scripts/build.sh --configuration Release

    - name: Test
      run: ./scripts/run-tests.sh --configuration Release

    - name: Publish coverage summary
      run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coveragereport

    - name: Publish
      run: |
        ./scripts/publish-all.sh
        ./scripts/make-release-artifacts.sh
        ls -1alR artifacts/

    - name: Upload artifacts (Linux)
      uses: actions/upload-artifact@v7
      with:
        name: qmk_toolbox-linux
        path: artifacts/*-linux-*

    - name: Upload artifacts (Windows)
      uses: actions/upload-artifact@v7
      with:
        name: qmk_toolbox-windows
        path: artifacts/*.exe

    - name: Upload artifacts (macOS)
      uses: actions/upload-artifact@v7
      with:
        name: qmk_toolbox-macos
        path: |
          artifacts/*.app.zip
          artifacts/*.dmg

  sign_macos:
    needs: build
    name: Sign and notarize (macOS)
    runs-on: ubuntu-latest
    # Never sign on pull_request (same-repo PRs would otherwise expose secrets).
    if: github.event_name != 'pull_request'
    environment: release-signing
    env:
      APP: 'publish-osx-dmg/QMK Toolbox.app'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Prepare signing material
      env:
        MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      run: ./scripts/macos-signing.sh setup

    - name: Sign bundled macOS binaries
      run: ./scripts/macos-signing.sh sign-resources resources/*/osx

    - name: Republish macOS with signed resources
      run: ./scripts/publish-all.sh osx-arm64 osx-x64

    - name: Build macOS .app bundle
      run: ./scripts/make-macos-app.sh

    - name: Sign macOS .app bundle
      run: ./scripts/macos-signing.sh sign-app "${APP}"

    - name: Notarize and staple macOS .app bundle
      run: ./scripts/macos-signing.sh notarize "${APP}"

    - name: Repackage signed .app (zip + dmg)
      run: |
        ./scripts/make-macos-app.sh --repack
        ./scripts/make-macos-dmg.sh

    - name: Clean up signing material
      if: always()
      run: ./scripts/macos-signing.sh cleanup

    - name: Upload signed artifacts
      uses: actions/upload-artifact@v7
      with:
        name: qmk_toolbox-macos-signed
        path: |
          artifacts/*.app.zip
          artifacts/*.dmg

  publish_release:
    needs: [build, sign_macos]
    name: Publish release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts (Linux)
      uses: actions/download-artifact@v8
      with:
        name: qmk_toolbox-linux
        merge-multiple: true

    - name: Download artifacts (Windows)
      uses: actions/download-artifact@v8
      with:
        name: qmk_toolbox-windows
        merge-multiple: true

    - name: Download artifacts (macOS)
      uses: actions/download-artifact@v8
      with:
        name: qmk_toolbox-macos-signed
        merge-multiple: true

    - name: Delete existing release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release delete --repo ${{ github.repository }} ${{ github.ref_name }} --yes || true

    - uses: softprops/action-gh-release@v3
      with:
        make_latest: true
        files: |
          qmk_toolbox-macOS.app.zip
          qmk_toolbox-macOS.dmg
          qmk_toolbox-linux-x64
          qmk_toolbox-linux-arm64
          qmk_toolbox.exe
          qmk_toolbox_install.exe

  publish_beta:
    needs: [build, sign_macos]
    name: Publish beta
    if: github.event_name == 'push' && github.ref == 'refs/heads/avalonia-net10-port'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download artifacts (Linux)
      uses: actions/download-artifact@v8
      with:
        name: qmk_toolbox-linux
        merge-multiple: true

    - name: Download artifacts (Windows)
      uses: actions/download-artifact@v8
      with:
        name: qmk_toolbox-windows
        merge-multiple: true

    - name: Download artifacts (macOS)
      uses: actions/download-artifact@v8
      with:
        name: qmk_toolbox-macos-signed
        merge-multiple: true

    - name: Delete existing beta release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release delete --repo ${{ github.repository }} beta-xplat --yes --cleanup-tag || true

    - uses: softprops/action-gh-release@v3
      with:
        tag_name: beta-xplat
        name: Beta-CrossPlatform
        prerelease: true
        make_latest: false
        target_commitish: ${{ github.sha }}
        files: |
          qmk_toolbox-macOS.app.zip
          qmk_toolbox-macOS.dmg
          qmk_toolbox-linux-x64
          qmk_toolbox-linux-arm64
          qmk_toolbox.exe
          qmk_toolbox_install.exe
